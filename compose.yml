# Restate + the worker, the deploy unit. `.env` supplies every secret
# (never baked in); the worker registers itself with Restate on start.
# Host ports are overridable when another Restate already sits on 8080/9070.
services:
  restate:
    image: restatedev/restate:1.7.10
    ports:
      - "127.0.0.1:${HOST_INGRESS_PORT:-8080}:8080" # ingress
      - "127.0.0.1:${HOST_ADMIN_PORT:-9070}:9070" # admin
    volumes:
      - restatedata:/restate-data
  worker:
    build: .
    env_file: .env
    environment:
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_ADMIN_URL: http://restate:9070
      RESTATE_ENDPOINT_URL: http://worker:9081
      RESTATE_PORT: "9081"
      UI_PORT: "9080"
      UI_HOST: 0.0.0.0 # the host side of the port map stays loopback-only
      BROWSER: ${BROWSER:-local}
      BROWSER_CHANNEL: chromium # the image ships Playwright's build, no Google Chrome
    ports:
      - "127.0.0.1:${HOST_UI_PORT:-9080}:9080" # UI + API; put a token in UI_TOKEN before exposing wider
    volumes:
      - workerdata:/data
    depends_on:
      - restate
    # Chromium needs a bigger /dev/shm than Docker's default.
    shm_size: 1g
    restart: unless-stopped
volumes:
  restatedata:
  workerdata:
