# Deploy main to the box: build the worker image, push it to ECR, run the box's
# deploy script over SSM (fresh env from SSM, pull, restart). Runs after `ci`
# is green. Secrets (repo settings): AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY,
# INSTANCE_ID. See deploy/README.md.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: build and push
        run: |
          docker build -t "$ECR:$GITHUB_SHA" -t "$ECR:latest" .
          docker push "$ECR:$GITHUB_SHA"
          docker push "$ECR:latest"
        env: { ECR: "${{ secrets.ECR_REPOSITORY }}" }
      # The box is stopped between jobs (it bills only when running): start it,
      # deploy, and release it: stopped again unless a person started it.
      - name: start the box
        run: deploy/scripts/box.sh start
        env: { AUTOBROWSE_INSTANCE_ID: "${{ secrets.INSTANCE_ID }}", BOX_STARTED_BY: deploy }
      - name: deploy on the box
        run: |
          # Ship the current deploy script and compose file first, then run: an edit to either
          # lands without a rebuild (first boot's user data is the only other copy).
          python3 - "$GITHUB_SHA" > /tmp/params.json <<'PY'
          import json, sys
          script = open("deploy/scripts/on-box-deploy.sh").read()
          compose = open("deploy/compose.prod.yml").read()
          cmds = [
            "cat > /opt/autobrowse/compose.yml.new <<'AUTOBROWSE_COMPOSE_EOF'\n" + compose + "\nAUTOBROWSE_COMPOSE_EOF",
            "mv /opt/autobrowse/compose.yml.new /opt/autobrowse/compose.yml",
            "cat > /usr/local/bin/autobrowse-deploy.new <<'AUTOBROWSE_DEPLOY_EOF'\n" + script + "\nAUTOBROWSE_DEPLOY_EOF",
            "chmod +x /usr/local/bin/autobrowse-deploy.new && mv /usr/local/bin/autobrowse-deploy.new /usr/local/bin/autobrowse-deploy",
            f"/usr/local/bin/autobrowse-deploy {sys.argv[1]}",
          ]
          print(json.dumps({"commands": cmds}))
          PY
          id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $GITHUB_SHA" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)"
          for _ in $(seq 1 60); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text; exit 1 ;;
            esac
          done
          echo "deploy still running after 5 min"; exit 1
        env: { INSTANCE_ID: "${{ secrets.INSTANCE_ID }}" }
      # No release step: the worker stops the box itself once idle (IDLE_STOP_MINUTES),
      # and a deploy must not pull it from under a call that queued while it booted.
